name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download the QR libraries
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js -o www/qrcode.js
          curl -fsSL https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js -o www/jsQR.js

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Apply the app icon
        run: |
          pip install pillow
          python3 - <<'PYEOF'
          from PIL import Image
          import os
          res = "android/app/src/main/res"
          dens = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}
          for k, (l, f) in dens.items():
              d = res + "/mipmap-" + k
              os.makedirs(d, exist_ok=True)
              Image.open("icon-legacy.png").resize((l, l), Image.LANCZOS).save(d + "/ic_launcher.png")
              Image.open("icon-round.png").resize((l, l), Image.LANCZOS).save(d + "/ic_launcher_round.png")
              Image.open("icon-foreground.png").resize((f, f), Image.LANCZOS).save(d + "/ic_launcher_foreground.png")
          os.makedirs(res + "/values", exist_ok=True)
          open(res + "/values/ic_launcher_background.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1F5FBF</color>\n</resources>\n')
          PYEOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: checklist-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
